<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Embarca IFMG</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
  <img src="assets/logo.png" alt="Logo Embarca IFMG">

  <div class="tempo">
    <div class="hora" id="hora">--:--</div>
    <div class="data" id="data">--/--/----</div>
    <div class="clima" id="clima">Clima carregando...</div>
  </div>
</header>

<!-- BARRA DE INTERAÇÃO (SÓ NO MODO PORTÁTIL) -->
<div class="toolbar" id="toolbar">
  <button class="btn" onclick="mostrarSecao('onibus')">Ônibus</button>
  <button class="btn" onclick="mostrarSecao('calendario')">Calendário</button>
  <button class="btn" onclick="mostrarSecao('turmas')">Turmas</button>
</div>

<main id="painel">
  <!-- Conteúdo dinâmico -->
</main>

<footer>
  Embarca IFMG — Desenvolvido por Paicheco & Heringe
</footer>

<!-- CONFIGURAÇÃO CENTRAL -->
<script src="js/config.js"></script>

<!-- MÓDULOS -->
<script src="js/clock.js"></script>
<script src="js/clima.js"></script>
<script src="js/onibus.js"></script>
<script src="js/calendario.js"></script>
<script src="js/turmas.js"></script>

<!-- APP -->
<script src="js/app.js"></script>

</body>
</html>
